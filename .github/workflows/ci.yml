name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed navigation surfaces
        run: npm run lint:ui

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated artifacts and snapshots
        run: npm run test:snapshots

      - name: Data consistency tests
        run: npm run test:dati

      - name: ETL unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' && python3 -m unittest discover -s tests/etl -p 'test_*.py'

      - name: Build
        run: npm run build
